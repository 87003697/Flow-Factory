# Trellis2 OPD contrastive FlowEdit — 1-GPU SMOKE variant.
# Reduces batch/rollout/eval so a 5-epoch smoke fits on a single H200 that
# also hosts the FlowEdit server (~42 GB) alongside training (~40-60 GB).
#
# Requires: 1 FlowEdit server on port 8090 (started separately).
#
# Diverges from tex_contrastive.yaml only in the fields marked below.

launcher: "accelerate"
config_file: null
num_processes: 1                  # SMOKE: single GPU (baseline: 8)
main_process_port: 29500
mixed_precision: "bf16"

data:
  datasets:
    - name: default
      dataset_dir: "dataset/trellis2"
      train:
        weight: 1
        max_dataset_size: null
      eval: {}
  preprocessing_batch_size: 2     # SMOKE: reduced from 4
  dataloader_num_workers: 4       # SMOKE: reduced from 8
  force_reprocess: false
  cache_dir: "/data/zhiyuan_ma/.cache/flow_factory/datasets"
  dataset_type: "image_3d"
  sampler_type: "distributed_group_aligned"

model:
  finetune_type: 'lora'
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "pretrained_weights/TRELLIS.2-4B"
  model_type: "trellis2"
  resume_path: null
  resume_type: null
  target_flow_model: "tex_slat_1024"
  decode_output: true
  render_num_frames: 8            # SMOKE: reduced from 16 (fewer FlowEdit calls per rollout)
  render_resolution: 512
  render_mode: "shaded"
  render_bg_color: [1, 1, 1]
  envmap_path: null
  dense_sde:
    dynamics_type: "ODE"
  shape_sde:
    dynamics_type: "ODE"

log:
  run_name: "contrastive-aligned-smoke1gpu"   # SMOKE
  project: "Flow-Factory"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 100                  # SMOKE: no save during smoke
  save_model_only: true

train:
  trainer_type: 'trellis2_opd'

  resolution: 1024
  num_inference_steps: 12
  timestep_range: 0.99

  per_device_batch_size: 1        # SMOKE: reduced from 2
  group_size: 1
  unique_sample_num_per_epoch: 8  # SMOKE: reduced from 64
  num_inner_epochs: 1
  gradient_step_per_epoch: 2      # SMOKE: reduced from 4
  gradient_accumulation_steps: 1

  learning_rate: 1.0e-5
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  max_epochs: 5                   # SMOKE (baseline: 200)

  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cpu"

  enable_gradient_checkpointing: true
  offload_samples_to_cpu: false
  seed: 42

  teacher_frame_strategy: "random"
  ref_kl_beta: 1.0
  use_visibility_mask: true
  visibility_mask_mode: "soft"

  flowedit:
    server_url_template: "http://localhost:809{rank}"  # rank=0 -> 8090
    prompt: "Rotate the camera. White background."
    cfg_tgt: 4.0
    cfg_src: 0.0
    n_max: 21
    steps: 28
    timeout: 180.0                # SMOKE: bumped for co-located server
    noise_mode: "aligned"
    seed: 42

scheduler:
  dynamics_type: "Flow-SDE"
  noise_level: 1.0
  num_sde_steps: 1
  sde_steps: [1, 2, 3]
  seed: 42

eval:
  resolution: 1024
  per_device_batch_size: 1
  num_inference_steps: 12
  eval_freq: 100                  # SMOKE: never fires in 5 epochs (baseline: 20)
  seed: 42

# SMOKE: rewards disabled to save GPU memory (pickscore loads on cuda).
# Contrastive loss doesn't require rewards; they only feed eval + logging.
rewards: []

eval_rewards: []
