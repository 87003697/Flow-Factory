# Trellis2 OPD self-distillation: dense stage, LoRA, base-as-teacher
# Teacher = pretrained base (LoRA disabled), Student = base + LoRA
# c_tgt = student rollout render -> random frame -> re-encoded
# Loss = 0.5 * ||mu_S(x_j, c_ref) - mu_T(x_j, c_tgt)||^2 / denom

# Environment Configuration
launcher: "accelerate"
config_file: null
num_processes: 7
main_process_port: 29500
mixed_precision: "bf16"

# Data Configuration
data:
  datasets:
    - name: default
      dataset_dir: "dataset/trellis2"
      train:
        weight: 1
        max_dataset_size: null
      eval: {}
  preprocessing_batch_size: 4
  dataloader_num_workers: 8
  force_reprocess: false
  cache_dir: "/data/zhiyuan_ma/.cache/flow_factory/datasets"
  dataset_type: "image_3d"
  sampler_type: "distributed_group_aligned"

# Model Configuration
model:
  finetune_type: 'lora'
  lora_rank: 64
  lora_alpha: 128
  target_modules: "default"
  model_name_or_path: "pretrained_weights/TRELLIS.2-4B"
  model_type: "trellis2"
  resume_path: null
  resume_type: null
  # Dense stage training
  target_flow_model: "dense"
  decode_output: true  # Required: c_tgt needs rendered views
  render_num_frames: 24
  render_resolution: 512
  render_mode: "shaded"  # Teacher sees full appearance (geometry + texture)
  render_bg_color: [0, 0, 0]
  envmap_path: null
  # Downstream stages use ODE (not trained, deterministic)
  shape_sde:
    dynamics_type: "ODE"
  tex_sde:
    dynamics_type: "ODE"

log:
  run_name: null
  project: "Flow-Factory"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

# Training Configuration
train:
  trainer_type: 'trellis2_opd'
  # OPD-specific
  timestep_range: 0.99
  num_inner_epochs: 1
  teacher_frame_strategy: 'random'
  ref_kl_beta: 0.5

  # Sampling settings
  resolution: 1024
  num_inference_steps: 12

  # Batch and sampling
  per_device_batch_size: 2
  group_size: 14
  max_epochs: 200
  unique_sample_num_per_epoch: 4
  gradient_accumulation_steps: 1

  # Optimizer
  learning_rate: 5.0e-5
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # EMA
  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cpu"

  # Gradient checkpointing
  enable_gradient_checkpointing: false

  # Seed
  seed: 42

# Scheduler Configuration (global default for the training stage = dense)
scheduler:
  dynamics_type: "Flow-SDE"
  noise_level: 1.0
  num_sde_steps: 1
  sde_steps: [1, 2, 3]
  seed: 42

# Evaluation settings
eval:
  resolution: 1024
  per_device_batch_size: 1
  num_inference_steps: 12
  eval_freq: 20
  seed: 42

# OPD does not need training rewards (loss is model-internal)
rewards: []

# Evaluation reward for monitoring generation quality
eval_rewards:
  name: "pickscore"
  reward_model: "PickScore"
  batch_size: 8
  device: "cuda"
  dtype: bfloat16
  async_reward: true
  num_workers: 1
