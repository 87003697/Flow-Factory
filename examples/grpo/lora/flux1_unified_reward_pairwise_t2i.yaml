# ============================================================
# FLUX.1 GRPO LoRA + UnifiedReward-2.0 Pairwise (Think) Reward
# ============================================================
# This example uses UnifiedReward-2.0-qwen3vl-8b as a pairwise
# reward model via vLLM's OpenAI-compatible API, comparing all
# C(K,2) pairs within each group and aggregating per-sample win
# rates.
#
# Prerequisites:
#   1. Start a vLLM server on a separate GPU (e.g., GPU 7):
#          CUDA_VISIBLE_DEVICES=7 vllm serve CodeGoat24/UnifiedReward-2.0-qwen3vl-8b \
#              --served-model-name UnifiedReward --host 0.0.0.0 --port 8080 \
#              --trust-remote-code --gpu-memory-utilization 0.9 \
#              --enable-prefix-caching \
#              --limit-mm-per-prompt '{"image": 32}'
#   2. Use the remaining GPUs for training (e.g., GPU 0-6):
#          CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6 ff-train examples/grpo/lora/flux1_unified_reward_pairwise_t2i.yaml
# ============================================================

# Environment Configuration
launcher: "accelerate"
config_file: config/deepspeed/deepspeed_zero2.yaml
num_processes: 7
main_process_port: 29500
mixed_precision: "bf16"

# Data Configuration
data:
  dataset_dir: "dataset/t2is"
  preprocessing_batch_size: 8
  dataloader_num_workers: 16
  force_reprocess: true
  cache_dir: "~/.cache/flow_factory/datasets"
  max_dataset_size: 1000
  sampler_type: "group_contiguous"  # pairwise (groupwise) rewards require all group samples on the same rank

# Model Configuration
model:
  finetune_type: 'lora'
  lora_rank : 64
  lora_alpha : 128
  target_modules: "default"
  model_name_or_path: "black-forest-labs/FLUX.1-dev"
  model_type: "flux1"
  resume_path: null
  resume_type: null

log:
  run_name: null
  project: "Flow-Factory"
  logging_backend: "wandb"
  save_dir: "saves/"
  save_freq: 20
  save_model_only: true

# Training Configuration
train:
  trainer_type: 'grpo'
  advantage_aggregation: 'gdpo'
  clip_range: 1.0e-4
  adv_clip_range: 5.0
  kl_type: 'v-based'
  kl_beta: 0
  ref_param_device: 'cuda'

  resolution: 512
  num_inference_steps: 10
  guidance_scale: 3.5

  per_device_batch_size: 2
  group_size: 4
  global_std: false
  unique_sample_num_per_epoch: 48
  gradient_step_per_epoch: 2
  gradient_accumulation_steps: auto

  learning_rate: 3.0e-4
  adam_weight_decay: 1.0e-4
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  ema_decay: 0.9
  ema_update_interval: 4
  ema_device: "cuda"

  enable_gradient_checkpointing: false

  seed: 42

# Scheduler Configuration
scheduler:
  dynamics_type: "Flow-SDE"
  noise_level: 0.7
  num_sde_steps: 1
  sde_steps: [1, 2, 3]
  seed: 42

# Evaluation settings
eval:
  resolution: 512
  per_device_batch_size: 1
  guidance_scale: 3.5
  num_inference_steps: 20
  eval_freq: 20
  seed: 42

# Reward Model Configuration
rewards:
  - name: "unified_reward_think_image_pairwise"
    reward_model: "unified_reward_think_image_pairwise"
    batch_size: 1
    api_base_url: "http://localhost:8080/v1"
    api_key: "EMPTY"
    vlm_model: "UnifiedReward"
    max_concurrent: 8
    max_retries: 5
    timeout: 120
    max_pairs: 6
    async_reward: true
    num_workers: 2

# Evaluation Reward Models (pointwise only; groupwise models are
# skipped during eval)
eval_rewards:
  - name: "unified_reward_image_acs"
    reward_model: "unified_reward_image_acs"
    batch_size: 8
    api_base_url: "http://localhost:8080/v1"
    api_key: "EMPTY"
    vlm_model: "UnifiedReward"
    alignment_weight: 1.0
    coherence_weight: 1.0
    style_weight: 1.0
    max_concurrent: 100
    max_retries: 10
    timeout: 120
    async_reward: true
    num_workers: 4
